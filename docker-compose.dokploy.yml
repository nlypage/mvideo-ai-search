services:
  client-backend:
    image: ghcr.io/nlypage/mvideo-ai-search:${BACKEND_IMAGE_TAG:-backend-latest}
    pull_policy: always
    env_file:
      - path: .env
        required: false
    environment:
      APP_MODE: client
      HTTP_ADDR: :8080
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.4-mini}
      AI_DEBUG: ${AI_DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "8080"
    restart: unless-stopped

  client-frontend:
    image: ghcr.io/nlypage/mvideo-ai-search:${CLIENT_IMAGE_TAG:-client-latest}
    pull_policy: always
    env_file:
      - path: .env
        required: false
    environment:
      APP_MODE: client
      BACKEND_ORIGIN: http://client-backend:8080
    depends_on:
      - client-backend
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    restart: unless-stopped

  consultant-backend:
    image: ghcr.io/nlypage/mvideo-ai-search:${BACKEND_IMAGE_TAG:-backend-latest}
    pull_policy: always
    env_file:
      - path: .env
        required: false
    environment:
      APP_MODE: consultant
      HTTP_ADDR: :8080
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.4-mini}
      AI_DEBUG: ${AI_DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CONSULTANT_ACCESS_TOKEN: ${CONSULTANT_ACCESS_TOKEN:-}
    expose:
      - "8080"
    restart: unless-stopped

  consultant-frontend:
    image: ghcr.io/nlypage/mvideo-ai-search:${CONSULTANT_IMAGE_TAG:-consultant-latest}
    pull_policy: always
    env_file:
      - path: .env
        required: false
    environment:
      APP_MODE: consultant
      BACKEND_ORIGIN: http://consultant-backend:8080
    depends_on:
      - consultant-backend
    ports:
      - "${CONSULTANT_PORT:-3001}:3000"
    restart: unless-stopped
