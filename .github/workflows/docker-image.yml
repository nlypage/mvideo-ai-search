name: Build and publish Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nlypage/mvideo-ai-search

jobs:
  build-and-push:
    name: Build ${{ matrix.app_mode }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_mode: client
            latest_tag: client-latest
          - app_mode: consultant
            latest_tag: consultant-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_APP_MODE=${{ matrix.app_mode }}
            VITE_LOW_MEMORY_BUILD=0
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.latest_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.app_mode }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app_mode }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app_mode }}
